    - name: Clean Cache
      command: apt-get clean

    - name: Refresh apt-cache
      command: apt-get update

    - name: Install System Tools
      apt:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - vim
          - nano
          - jq
          - tmux
          - cockpit
          - git
          - ufw
          - wget
          - golang
          - bzip2
          - dos2unix
          - containerd.io
          - docker-ce 
          - docker-ce-cli
          - docker-compose-plugin


###################################
# Firewall
###################################

    - name: Start UFW Service
      systemd:
        name: ufw
        state: started
        enabled: yes

    - name: Add Elasticsearch Firewall Rule
      ufw:
        rule: allow
        port: '9200'
        proto: tcp
        state: enabled
        
    - name: Add Kibana Firewall Rule
      ufw:
        rule: allow
        port: '5601'
        proto: tcp
        state: enabled
        
    - name: Add Fleet Server Rule
      ufw:
        rule: allow
        port: '8220'
        state: enabled

    - name: Add SSH Rule for Vagrant
      ufw:
         rule: allow
         port: '22'
         proto: tcp
         state: enabled 

