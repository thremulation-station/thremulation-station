# Elastic Container Project

    - name: Start and Enable Docker
      systemd: 
        name: docker
        state: started
        enabled: yes

    - name: Download ECP
      git:
        repo: https://github.com/peasead/elastic-container
        dest: /home/vagrant/elastic-container/

    - name: Add environment file
      copy:
        src: ./files/.env
        dest: /home/vagrant/elastic-container/.env

    - name: Confirm Directory Permissions
      file:
        path: /home/vagrant/elastic-container
        state: directory
        recurse: yes
        owner: vagrant
        group: vagrant
    
    - name: Run ECP Install
      command: /home/vagrant/elastic-container/elastic-container.sh stage
      args:
        chdir: /home/vagrant/elastic-container/

###################################
# Powershell
###################################

    - name: Install libicu72 from Debian 12 repo (for Debian 13)
      ansible.builtin.apt:
        deb: "http://ftp.debian.org/debian/pool/main/i/icu/libicu72_72.1-3+deb12u1_amd64.deb"
        state: present
      #when: "'13' in debian_version.stdout or 'trixie' in debian_version.stdout

    - name: Download PowerShell 7 package
      ansible.builtin.get_url:
        url: "{{ pwsh_download_url }}"
        dest: "/tmp/powershell_{{ pwsh_version }}-1.deb_amd64.deb"
        mode: '0644'
      vars:
        pwsh_version: "7.5.4"
        pwsh_download_url: "https://github.com/PowerShell/PowerShell/releases/download/v{{ pwsh_version }}/powershell_{{ pwsh_version }}-1.deb_amd64.deb"

    - name: Install PowerShell 7 package
      ansible.builtin.apt:
        deb: "/tmp/powershell_{{ pwsh_version }}-1.deb_amd64.deb"
        state: present
      register: pwsh_install
      vars:
        pwsh_version: "7.5.4"


